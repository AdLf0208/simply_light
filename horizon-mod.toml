id = "simplylight"
name = "Simply Light"
version = "0.2.1"
description = """One hundred and sixty light-emitting decorative blocks in ten families, one per
vanilla dye colour: plain lamps in off and on variants, slabs and panels, wall lamps, bulbs, rod
lamps, three-block lamp posts, and edge lights. A content-only carry: the 160 block declarations,
2048 states, models, textures, 234 recipes and 12 tags are data in this package, and it carries no
Rust crate, no hooks and no native code. Redstone toggling, the lamp-post column, tooltips and the
edge-light editor are not ported yet."""
authors = ["Flanks255 (upstream)", "Horizon native mod contributors"]
# The content mod (mod API 0.2): a flat .hmod carrying the blocks in data/ and assets/. The id
# is the resource namespace and the only identity. No [native] block: this package has no code
# half, and a registry entry that is already `kind = "mod"` keeps that kind for every version.
api = "0.2"
# The installation side, not the hook's: single player and a LAN host are a client
# installation with an integrated server, so a content mod that must appear in both
# belongs on "both".
side = "both"
# Required by the content-mod manifest schema ("May add blocks, items, mob effects and entity
# types"). The 160 blocks and their items are declared as content in data/; Rust registers
# nothing because there is none.
capabilities = ["registries"]
